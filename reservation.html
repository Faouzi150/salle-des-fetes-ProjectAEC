<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande de réservation — Palais des Fêtes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="conteneur nav-barre">
      <a href="index.html" class="logo">Palais des Fêtes</a>
      <nav aria-label="Navigation principale">
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="catalogue.html">Nos Salles</a></li>
          <li><a href="reservation.html" class="actif">Réserver</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="conteneur">
    <h1 class="section-titre">Demander une réservation</h1>

    <form action="reservation.html" method="post" class="formulaire-bloc">
      <div class="champ">
        <label for="id_salle">Salle souhaitée *</label>
        <select id="id_salle" name="id_salle" required>
          <option value="">-- Choisissez une salle --</option>
          <option value="1">Salon Royal (350 pers. max — 1 800 €)</option>
          <option value="2">Jardin d'Hiver (150 pers. max — 950 €)</option>
          <option value="3">Espace Horizon (90 pers. max — 600 €)</option>
        </select>
      </div>

      <div class="champ">
        <label for="id_formule">Formule complémentaire (optionnel)</label>
        <select id="id_formule" name="id_formule">
          <option value="">Aucune formule</option>
          <option value="1">Pack Son &amp; Lumière (+ 350 €)</option>
          <option value="2">Décoration Florale (+ 480 €)</option>
        </select>
      </div>

      <div class="champ">
        <label for="date_evenement">Date de l'événement *</label>
        <input type="date" id="date_evenement" name="date_evenement" required>
      </div>

      <div class="champ">
        <label for="nb_invites">Nombre d'invités estimé *</label>
        <input type="number" id="nb_invites" name="nb_invites" min="10" max="500" required>
      </div>

      <div class="champ">
        <label for="nom_client">Nom et prénom *</label>
        <input type="text" id="nom_client" name="nom_client" required>
      </div>

      <div class="champ">
        <label for="email_client">Adresse e-mail *</label>
        <input type="email" id="email_client" name="email_client" required>
      </div>

      <div class="champ">
        <label for="telephone_client">Téléphone *</label>
        <input type="tel" id="telephone_client" name="telephone_client" required>
      </div>

      <div class="champ">
        <label for="commentaire">Précisions ou besoins particuliers</label>
        <textarea id="commentaire" name="commentaire" rows="4"></textarea>
      </div>

      <button type="submit" class="btn btn-primaire">Envoyer la demande</button>
    </form>
  </main>

  <footer>
    <div class="conteneur">
      <p>&copy; 2026 Palais des Fêtes — ProjetAEC. Tous droits réservés.</p>
    </div>
  </footer>
</body>
</html>
